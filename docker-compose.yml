services:
  db:
    image: postgres:10
    environment:
      POSTGRES_USER: rqbin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rqbin_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: bundle exec rails server -b 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "3001:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://rqbin:password@db:5432/rqbin_development
      RAILS_ENV: development

volumes:
  postgres_data:
